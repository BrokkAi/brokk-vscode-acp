[package]
name = "brokk-acp-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust ACP runtime for the Brokk VS Code extension"

[dependencies]
agent-client-protocol = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
