[package]
name = "brokk-acp-host"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust ACP runtime for the Brokk VS Code extension"

[dependencies]
agent-client-protocol = { version = "1", features = ["unstable"] }
anyhow = "1"
bzip2 = "0.6"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate", "bzip2"] }
