name: Release Brokk ACP

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
    paths:
      - package.json
      - package-lock.json
      - Cargo.lock
      - crates/acp-host/Cargo.toml
      - CHANGELOG.md
      - legal/host/THIRD_PARTY_LICENSES.html

permissions:
  contents: read

concurrency:
  group: brokk-acp-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release-context.outputs.release }}
      tag: ${{ steps.release-context.outputs.tag }}
      version: ${{ steps.release-context.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo install --locked cargo-about --version 0.9.1 --features cli
      - run: cargo fetch --locked
      - run: npm test
      - run: npm run license:check
      - name: Determine release context
        id: release-context
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          release=false
          previous_version=""

          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Release tag $REF_NAME does not match package version $version"
              exit 1
            fi
            release=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "master" ]; then
            if [ -n "$BEFORE_SHA" ] &&
              [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
              git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
              git show "$BEFORE_SHA:package.json" > "$RUNNER_TEMP/previous-package.json"
              previous_version="$(
                node -p "require(process.argv[1]).version" "$RUNNER_TEMP/previous-package.json"
              )"
            fi
            if [ "$version" != "$previous_version" ]; then
              if [ -n "$previous_version" ]; then
                node -e '
                  const [current, previous] = process.argv.slice(1)
                    .map((value) => value.split(".").map(Number));
                  const changed = current.findIndex((value, index) => value !== previous[index]);
                  if (changed < 0 || current[changed] < previous[changed]) {
                    console.error(`::error::Version ${current.join(".")} must be greater than ${previous.join(".")}`);
                    process.exit(1);
                  }
                ' "$version" "$previous_version"
              fi
              release=true
            fi
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release context: release=$release, tag=$tag, previous=${previous_version:-none}"
      - name: Validate release version and default-branch ancestry
        if: steps.release-context.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          npm run release:check -- --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  package:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || needs.validate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: npm ci
      - run: npm run package -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: brokk-vscode-acp-${{ matrix.target }}
          path: artifacts/*.vsix
          if-no-files-found: error

  create-tag:
    if: needs.validate.outputs.release == 'true'
    needs:
      - validate
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
          if git rev-parse --verify --quiet "$RELEASE_TAG^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "::error::$RELEASE_TAG already points to $tagged_commit, not $GITHUB_SHA"
              exit 1
            fi
            echo "$RELEASE_TAG already points to this release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Brokk ACP $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  publish-marketplace:
    if: needs.validate.outputs.release == 'true'
    needs:
      - validate
      - package
      - create-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: brokk-vscode-acp-*
          path: artifacts
          merge-multiple: true
      - name: Verify Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not configured for this repository"
            exit 1
          fi
      - name: Publish all platform packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --skip-duplicate --packagePath artifacts/*.vsix

  publish-open-vsx:
    if: needs.validate.outputs.release == 'true'
    needs:
      - validate
      - package
      - create-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: brokk-vscode-acp-*
          path: artifacts
          merge-multiple: true
      - name: Verify Open VSX credential
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not configured for this repository"
            exit 1
          fi
      - name: Publish all platform packages to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish --skip-duplicate artifacts/*.vsix

  github-release:
    if: needs.validate.outputs.release == 'true'
    needs:
      - validate
      - create-tag
      - publish-marketplace
      - publish-open-vsx
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: brokk-vscode-acp-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" artifacts/*.vsix \
              --verify-tag \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
